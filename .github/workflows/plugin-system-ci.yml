name: Plugin System CI

on:
  push:
    branches: [feature/plugin-system]
  pull_request:
    branches: [feature/plugin-system]
  workflow_dispatch:

jobs:
  test_go:
    name: Run Plugin System Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
        go-version: ['1.22']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: awalsh128/cache-apt-pkgs-action@latest
        if: matrix.os == 'ubuntu-22.04'
        with:
          packages: libgtk-3-dev libwebkit2gtk-4.0-dev build-essential pkg-config
          version: 1.0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go-version }}
          cache-dependency-path: ./v2/go.sum

      - name: Run tests (mac)
        if: matrix.os == 'macos-latest'
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers -mmacosx-version-min=10.13
        working-directory: ./v2
        run: go test -v ./...

      - name: Run tests (!mac)
        if: matrix.os != 'macos-latest'
        working-directory: ./v2
        run: go test -v ./...

  upstream_compatibility:
    name: Check Upstream Compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check merge conflicts with upstream
        run: |
          git remote add upstream https://github.com/wailsapp/wails.git || true
          git fetch upstream master
          git merge-tree $(git merge-base HEAD upstream/master) HEAD upstream/master > merge-check.txt
          if grep -q "<<<<<<< " merge-check.txt; then
            echo "Warning: Potential merge conflicts with upstream detected"
            cat merge-check.txt
          else
            echo "No merge conflicts detected with upstream"
          fi